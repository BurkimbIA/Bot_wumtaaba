name: Tests et déploiement Fly.io
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q
      - name: Vérifier la construction de l’image
        run: docker build -t bot-wumtaaba:ci .
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fly-production-bot-wumtaaba
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Déployer sur Fly.io
        run: flyctl deploy --remote-only --app bot-wumtaaba
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Vérifier le service déployé
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 https://bot-wumtaaba.fly.dev/healthz | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
