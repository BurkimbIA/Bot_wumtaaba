name: Tests et déploiement Fly.io
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: just install
      - run: just lint
      - run: just test
      - name: Vérifier la construction de l’image
        run: docker build -t bot-wumtaaba:ci .
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fly-production-bot-wumtaaba
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Déployer sur Fly.io
        run: flyctl deploy --remote-only --ha=false --app bot-wumtaaba
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Vérifier le service déployé
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 https://bot-wumtaaba.fly.dev/healthz | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
