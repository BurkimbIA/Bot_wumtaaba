app = 'bot-wumtaaba'
primary_region = 'cdg'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'python -m bot_wumtaaba.server'

[env]
  PUBLIC_ACCESS = 'true'
  RETENTION_DAYS = '0'
  REMINDER_ENABLED = 'true'
  GRAPH_VERSION = 'v25.0'
  TRANSCRIPTION_MODEL = 'gemini-3.8-flash'
  EXTRACTION_MODEL = 'gemini-3.8-flash'
  MAX_AUDIO_BYTES = '14000000'
  SUPABASE_URL = 'https://iagyxtstnbgstdyppgnp.supabase.co'
  IDLE_SHUTDOWN_SECONDS = '300'

[http_service]
  internal_port = 8000
  force_https = true
  # The bot stops itself once its queues are empty (IDLE_SHUTDOWN_SECONDS): Fly's proxy only sees
  # requests, and would stop the machine while a reply is still being prepared after the webhook.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

# A clean idle exit (code 0) leaves the machine stopped until the next request.
[[restart]]
  policy = 'on-failure'
  retries = 10
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
