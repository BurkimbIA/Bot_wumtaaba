app = "bot-wumtaaba"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/app/data/bot.sqlite3"
  MEDIA_DIRECTORY = "/app/data/media"
  RETENTION_DAYS = "0"
  REMINDER_ENABLED = "true"
  GRAPH_VERSION = "v25.0"
  TRANSCRIPTION_MODEL = "gemini-3.8-flash"
  EXTRACTION_MODEL = "gemini-3.8-flash"
  MAX_AUDIO_BYTES = "14000000"

[[mounts]]
  source = "bot_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
